name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pepepow-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Configure deployment SSH key
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pepepow_deploy
          chmod 600 ~/.ssh/pepepow_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Trigger edison2 deployment
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          ssh \
            -i ~/.ssh/pepepow_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST"
