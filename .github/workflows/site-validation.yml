name: Site validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Validate legacy routes
        run: python3 scripts/migration/validate_legacy_routes.py

      - name: Validate migrated content links
        run: python3 scripts/migration/validate_content_links.py

      - name: Validate legacy article safety
        run: python3 scripts/migration/validate_legacy_article_safety.py

      - name: Validate accessibility basics
        run: python3 scripts/migration/validate_accessibility_basics.py

      - name: Inventory current external links
        run: python3 scripts/migration/audit_external_links.py --inventory-only

      - name: Inventory historical announcement links
        run: >-
          python3 scripts/migration/audit_external_links.py scripts/news/fetch_lens.py
          src/content/announcements/*.md
          --inventory-only
          --output migration/work/announcement-external-link-audit.json

      - name: Compile-check migration scripts
        run: python3 -m py_compile scripts/migration/wxr_inventory.py scripts/migration/wxr_extract.py scripts/migration/wxr_manifests.py scripts/migration/media_probe.py scripts/migration/collect_uploads.py scripts/migration/stage_recovered_media.py scripts/migration/validate_legacy_routes.py scripts/migration/validate_content_links.py scripts/migration/validate_legacy_article_safety.py scripts/migration/validate_accessibility_basics.py scripts/migration/audit_external_links.py
