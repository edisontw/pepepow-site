name: Update PEPEPOW Lens

on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pepepow-lens-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch small Lens dataset
        run: python3 scripts/news/fetch_lens.py

      - name: Validate generated JSON
        run: python3 -m json.tool src/data/generated/pepepow-lens.json > /dev/null

      - name: Commit changed Lens data
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/generated/pepepow-lens.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/pepepow-lens.json
          git commit -m "chore: refresh PEPEPOW Lens"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger production deployment
        if: steps.commit.outputs.changed == 'true' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             "repos/${{ github.repository }}/actions/workflows/deploy-production.yml/dispatches"             -f ref=main
